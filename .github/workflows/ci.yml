# CI: 単一ジョブで全チェックを直列実行する。
# **ネットワーク・Cloudflare の認証情報なしで green になることが不変条件**
# (vitest の Workers project はローカルの workerd だけで走るので API トークンは要らない)。
# チェック列の実体は package.json の `check` (lint / typecheck / knip / test / build) —
# ローカルの push 前ゲートと同一コマンドで、乖離を構造的に防ぐ。
#
# `secrets.required` を宣言しているので、テスト中に「Missing required secrets」の
# 警告が出る。**CI に秘密を置かない設計どおりの表示**で、失敗ではない。
name: CI

on:
  pull_request:
    # edited も対象: PR タイトルを後から直したときに再検査する
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# PR 単位 (main への push はブランチ単位) で 1 本に絞る。
#
# **cancel するのは PR のときだけ。** main への push で cancel すると、連続マージのときに
# 前のコミットの run が途中で消え、(1) そのコミットが green だった記録が残らず、
# (2) `deploy` は `needs: ci` なので動く機会を失う (実際に #16 の run が #15 のマージで
# 消えた)。後続の run が新しいコードをデプロイするので結果は収束するが、
# 連続マージの直後に止まると最後のデプロイが飛ぶ。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Markdown の相対リンクを検査
        run: ./scripts/check-links.sh
      # 外部 action を使わない。履歴の体裁を守るだけの検査に
      # サプライチェーンのリスクを負う理由がない
      - name: PR タイトルの形式を検査
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-pr-title.sh

  # デプロイは **main への push だけ、ci が通った後**。ローカルからは打たない (ADR-0014)。
  # required status check は `ci` だけにする。条件付きでスキップされる deploy を
  # required にすると auto-merge が永久に pending になる。
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # **トークンは Environment secrets に置く。** Repository secrets だとリポジトリの
    # 全ワークフローから読めてしまう。Cloudflare は OIDC に対応しておらず長命トークンを
    # 置くしかないので、読める範囲を宣言したジョブだけに絞る。
    # あわせて Environment 側で **deployment branch を main に限定**する
    # (ワークフローの if と独立に GitHub 側で強制される)。
    # **required reviewers は付けない** — 毎回のデプロイが承認待ちで止まり、
    # 「Actions から自動でデプロイする」(ADR-0014) と衝突する。
    environment: production
    # **途中で止めない。** マイグレーション適用中に中断されると、スキーマだけ進んで
    # コードが古いまま残る状態になりうる
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      # CLOUDFLARE_ACCOUNT_ID は要らない。wrangler.jsonc の account_id と代替関係で、
      # 設定がある方が優先される (wrangler のエラーメッセージが明示している)。
      # 設定に書いてあるとアカウント一覧の API 呼び出しも省かれる
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # **WORKER_SECRET が揃っているか。** wrangler.jsonc の secrets.required に宣言して
      # いるので、Worker がまだ存在しない状態の deploy はこれが無いと必ず例外になる
      # (wrangler の secrets-validation)。値そのものは渡さず、真偽だけを見る
      WORKER_SECRET_PRESENT: ${{ secrets.WORKER_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 揃っていなければ CI を落とさずスキップする。**デプロイできない状態を赤で知らせない**
      - name: デプロイに必要なものが揃っているか確認
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN が未設定なのでデプロイをスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$WORKER_SECRET_PRESENT" != "true" ]; then
            echo "::notice::WORKER_SECRET が未設定なのでデプロイをスキップします (secrets.required を満たせないため、初回デプロイは必ず失敗する)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # **D1 が無ければ作る** (Issue #36)。ローカルからリモートを操作しない (ADR-0014) ので、
      # 作る場所も CI にする。毎回走るが、ある限り一覧を見るだけ (初回だけの段を作らない。決定 7 と同じ形)。
      #
      # - 有無は `d1 list --json` で見る。`d1 info` は分析用の GraphQL も叩くので、トークンの権限次第で
      #   データベースがあっても失敗し、作り直そうとして落ちうる
      # - 一覧が取れない・読めないときは作らずに落とす (有無が分からないまま create しない)
      # - **`--location apac` を付ける。** 付けないと作成を要求した場所 (CI のランナー) の近くになり、
      #   日本の利用者から遠い。`wrangler deploy` の自動作成は場所を指定できないので、ここで先に作る
      # - 作った ID は Actions のログに出る。wrangler.jsonc の database_id に固定する
      - name: D1 が無ければ作る
        if: steps.guard.outputs.skip != 'true' && hashFiles('migrations/*.sql') != ''
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          status=0
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            let databases;
            try {
              databases = JSON.parse(readFileSync(process.argv[1], "utf8"));
            } catch {
              console.error("d1 list の出力を JSON として読めない");
              process.exit(2);
            }
            if (!Array.isArray(databases)) {
              console.error("d1 list の出力が配列でない");
              process.exit(2);
            }
            process.exit(databases.some((db) => db.name === "cosense-grass") ? 0 : 1);
          ' "$RUNNER_TEMP/d1-list.json" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "D1 cosense-grass はある"
          elif [ "$status" -eq 1 ]; then
            echo "::notice::D1 cosense-grass が無いので作る (location: apac)"
            npx wrangler d1 create cosense-grass --location apac
          else
            exit "$status"
          fi
      # スキーマはコードより先に上げる。逆にすると新しいコードがまだ無いテーブルを引く
      # 時間帯ができる。識別子は**データベース名**で指定する (バインディング名は変わりうる)。
      # `--remote` を必ず明示する (省略時の既定はローカル)。
      # **マイグレーションが 1 本も無いうちは走らせない。**
      - name: D1 マイグレーションを適用
        if: steps.guard.outputs.skip != 'true' && hashFiles('migrations/*.sql') != ''
        run: npx wrangler d1 migrations apply cosense-grass --remote
      # **secrets は毎回 --secrets-file で渡す。** 初回デプロイ (Worker が存在しない) は
      # これが無いと secrets.required で落ち、2 回目以降は inherit になるので渡しても無害。
      # 経路を 1 本にするため、初回だけの特別な段 (workflow_dispatch) を作らない。
      #
      # **JSON で書く。** wrangler はまず JSON として読み、失敗したら dotenv として読む。
      # dotenv は値の ` #` 以降を注釈として捨てる。WORKER_SECRET は一度決めたら変えられない
      # (変えると全利用者の識別子が変わる) ので、化けた値が初回デプロイで入ると取り返しがつかない。
      #
      # **シェルに値を展開させない。** run: に secrets を直接書くと、スクリプトの文字列に
      # 埋め込まれてから実行される。env: で渡し、Node が process.env から読んで書き出す
      - name: secrets のファイルを作る
        if: steps.guard.outputs.skip != 'true'
        env:
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { join } from "node:path";
            const value = process.env.WORKER_SECRET;
            if (!value) {
              console.error("WORKER_SECRET が空。guard を通過したのに値が無い");
              process.exit(1);
            }
            const file = join(process.env.RUNNER_TEMP, "worker-secrets.json");
            writeFileSync(file, JSON.stringify({ WORKER_SECRET: value }), { mode: 0o600 });
          '
      - name: デプロイ
        if: steps.guard.outputs.skip != 'true'
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      # **失敗しても残さない。** ランナーは使い捨てだが、後続の段から読める時間を作らない
      - name: secrets のファイルを消す
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
